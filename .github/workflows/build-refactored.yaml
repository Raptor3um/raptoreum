name: Raptoreum Build

on:
  push:
    branches:
      - master
      - develop
      - "ft/*"
      - "bug/*"
      - "release/*"
  pull_request:
    branches:
      - develop
  workflow_dispatch:

env:
  COIN_NAME: raptoreum
  BUILD_DIR: raptoreum-build
  COMPRESS_DIR: raptoreum-compress
  TEST_DIR: raptoreum-test
  FALLBACK_DOWNLOAD_PATH: https://sign.raptoreum.com/depends/

jobs:
  get-version:
    name: Get Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.selected-version.outputs.version }}
    steps:
      - name: Triggered By
        run: echo "checking out $GITHUB_REF triggered by $GITHUB_EVENT_NAME"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Read versions
        id: versions
        uses: christian-draeger/read-properties@1.1.1
        with:
          path: build.properties
          properties: "release-version candidate-version snapshot-version"

      - name: Choose version
        id: selected-version
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]] || [[ "$GITHUB_REF" == *develop ]] || [[ "$GITHUB_REF" == *ft/* ]] || [[ "$GITHUB_REF" == *bug/* ]]; then
              version=${{ steps.versions.outputs.snapshot-version }}
          elif [[ "$GITHUB_EVENT_NAME" != "pull_request" ]] && [[ "$GITHUB_REF" == *"release/"* ]]; then
              version=${{ steps.versions.outputs.candidate-version }}
          elif [[ "$GITHUB_EVENT_NAME" != "pull_request" ]] && [[ "$GITHUB_REF" == "refs/heads/master" ]]; then
              version=${{ steps.versions.outputs.release-version }}
          fi
          echo "version is: [$version]"
          echo "version=$version" >> $GITHUB_OUTPUT
          echo "BUILD_VERSION=$version" > version.txt

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: version
          path: version.txt

  # ============================================================================
  # Linux Builds (Ubuntu 22, Ubuntu 24, ARM64)
  # ============================================================================
  
  build-linux:
    name: ${{ matrix.platform.name }} Build
    needs: get-version
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Ubuntu 22
            runner: ubuntu-22.04
            host: x86_64-pc-linux-gnu
            packages: curl libcurl4-openssl-dev build-essential libtool autotools-dev automake pkg-config python3 bsdmainutils cmake ccache
            platform-id: ubuntu22
            
          - name: Ubuntu 24
            runner: ubuntu-24.04
            host: x86_64-pc-linux-gnu
            packages: curl libcurl4-openssl-dev build-essential libtool autotools-dev automake pkg-config python3 bsdmainutils cmake ccache
            platform-id: ubuntu24
            
          - name: ARM 64-bit
            runner: ubuntu-22.04
            host: aarch64-linux-gnu
            packages: curl libcurl4-openssl-dev build-essential libtool g++-aarch64-linux-gnu autotools-dev automake pkg-config python3 bsdmainutils cmake ccache
            platform-id: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Required Packages
        run: |
          sudo apt-get update -y
          sudo apt-get install ${{ matrix.platform.packages }} -y

      - name: Setup Dependencies
        uses: ./.github/actions/setup-depends
        with:
          host: ${{ matrix.platform.host }}
          fallback-download-path: ${{ env.FALLBACK_DOWNLOAD_PATH }}

      - name: Build Release Binaries
        uses: ./.github/actions/build-binaries
        with:
          host: ${{ matrix.platform.host }}
          build-type: release

      - name: Collect Release Binaries
        run: |
          mkdir -p ${BUILD_DIR} ${BUILD_DIR}_not_strip ${TEST_DIR}
          cp src/{raptoreum-cli,raptoreumd,qt/raptoreum-qt} ${BUILD_DIR}/
          mv src/{raptoreum-cli,raptoreumd,qt/raptoreum-qt} ${BUILD_DIR}_not_strip/
          mv src/test/test_raptoreum ${TEST_DIR}
          strip ${BUILD_DIR}/*

      - name: Clean for Debug Build
        run: |
          make clean
          make distclean

      - name: Build Debug Binaries
        uses: ./.github/actions/build-binaries
        with:
          host: ${{ matrix.platform.host }}
          build-type: debug

      - name: Collect Debug Binaries
        run: |
          mkdir -p ${BUILD_DIR}_debug
          mv src/{raptoreum-cli,raptoreumd,qt/raptoreum-qt} ${BUILD_DIR}_debug/

      - name: Package Artifacts
        uses: ./.github/actions/package-artifacts
        with:
          platform: ${{ matrix.platform.platform-id }}
          version: ${{ needs.get-version.outputs.version }}
          coin-name: ${{ env.COIN_NAME }}

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.COIN_NAME }}-${{ matrix.platform.platform-id }}-${{ needs.get-version.outputs.version }}
          path: ${{ env.COMPRESS_DIR }}

      - name: Upload Test Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.COIN_NAME }}-${{ matrix.platform.platform-id }}-test-${{ needs.get-version.outputs.version }}
          path: ${{ env.TEST_DIR }}

  test-linux:
    name: ${{ matrix.platform.name }} Tests
    needs: [get-version, build-linux]
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Ubuntu 22
            runner: ubuntu-22.04
            platform-id: ubuntu22
            
          - name: Ubuntu 24
            runner: ubuntu-24.04
            platform-id: ubuntu24

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Test Artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.COIN_NAME }}-${{ matrix.platform.platform-id }}-test-${{ needs.get-version.outputs.version }}

      - name: Run Tests
        uses: ./.github/actions/run-tests
        with:
          platform: ${{ matrix.platform.name }}
          version: ${{ needs.get-version.outputs.version }}
          coin-name: ${{ env.COIN_NAME }}

  # ============================================================================
  # Windows Build
  # ============================================================================
  
  build-windows:
    name: Windows 64-bit Build
    needs: get-version
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Required Packages
        run: |
          sudo apt-get update -y
          sudo apt-get install curl libcurl4-openssl-dev build-essential libtool autotools-dev automake pkg-config python3 bsdmainutils cmake ccache -y
          sudo apt-get install -y g++-mingw-w64-x86-64 gcc-mingw-w64-x86-64 nsis
          sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix

      - name: Setup Dependencies
        uses: ./.github/actions/setup-depends
        with:
          host: x86_64-w64-mingw32
          fallback-download-path: ${{ env.FALLBACK_DOWNLOAD_PATH }}

      - name: Build Release Binaries
        uses: ./.github/actions/build-binaries
        with:
          host: x86_64-w64-mingw32
          build-type: release

      - name: Collect Release Binaries
        run: |
          mkdir -p ${BUILD_DIR} ${BUILD_DIR}_not_strip ${TEST_DIR}
          cp src/{raptoreum-cli.exe,raptoreumd.exe,qt/raptoreum-qt.exe} ${BUILD_DIR}/
          mv src/{raptoreum-cli.exe,raptoreumd.exe,qt/raptoreum-qt.exe} ${BUILD_DIR}_not_strip/
          mv src/test/test_raptoreum.exe ${TEST_DIR}
          strip ${BUILD_DIR}/*

      - name: Package Windows Artifacts
        run: |
          cd ${BUILD_DIR}
          echo "sha256:" >> checksums.txt
          echo "------------------------------------" >> checksums.txt
          shasum * >> checksums.txt
          echo "------------------------------------" >> checksums.txt
          echo "openssl-sha256:" >> checksums.txt
          echo "------------------------------------" >> checksums.txt
          sha256sum * >> checksums.txt
          cat checksums.txt
          zip -r ../${COIN_NAME}-win-${{ needs.get-version.outputs.version }}.zip .
          
          cd ../${BUILD_DIR}_not_strip
          echo "sha256:" >> checksums.txt
          echo "------------------------------------" >> checksums.txt
          shasum * >> checksums.txt
          echo "------------------------------------" >> checksums.txt
          echo "openssl-sha256:" >> checksums.txt
          echo "------------------------------------" >> checksums.txt
          sha256sum * >> checksums.txt
          cat checksums.txt
          zip -r ../${COIN_NAME}-win-not_strip-${{ needs.get-version.outputs.version }}.zip .
          
          cd ..
          mkdir -p ${COMPRESS_DIR}
          mv *.zip ${COMPRESS_DIR}/
          
          cd ${COMPRESS_DIR}
          echo "sha256: $(shasum ${COIN_NAME}-win-${{ needs.get-version.outputs.version }}.zip)" >> checksums.txt
          echo "openssl-sha256: $(sha256sum ${COIN_NAME}-win-${{ needs.get-version.outputs.version }}.zip)" >> checksums.txt
          echo "sha256: $(shasum ${COIN_NAME}-win-not_strip-${{ needs.get-version.outputs.version }}.zip)" >> checksums.txt
          echo "openssl-sha256: $(sha256sum ${COIN_NAME}-win-not_strip-${{ needs.get-version.outputs.version }}.zip)" >> checksums.txt
          cat checksums.txt

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.COIN_NAME }}-win64-${{ needs.get-version.outputs.version }}
          path: ${{ env.COMPRESS_DIR }}

      - name: Upload Test Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.COIN_NAME }}-win64-test-${{ needs.get-version.outputs.version }}
          path: ${{ env.TEST_DIR }}

  test-windows:
    name: Windows 64-bit Tests
    needs: [get-version, build-windows]
    runs-on: windows-latest

    steps:

      - name: Download Test Artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.COIN_NAME }}-win64-test-${{ needs.get-version.outputs.version }}

      - name: Run Unit Tests
        id: tests
        shell: cmd
        run: test_raptoreum.exe --log_format=JUNIT > unit_test_results.xml

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ env.COIN_NAME }}-win64-test-results-${{ needs.get-version.outputs.version }}
          path: unit_test_results.xml

      - name: Publish Unit Test Report
        uses: mikepenz/action-junit-report@v5
        if: always()
        with:
          check_name: "Windows 64"
          detailed_summary: ${{ steps.tests.conclusion == 'failure' }}
          include_passed: false
          report_paths: unit_test_results.xml

