name: Raptoreum Build

on:
  push:
    branches:
      - master
      - develop
      - "ft/*"
      - "bug/*"
      - "release/*"
  pull_request:
    branches:
      - develop
  workflow_dispatch:

env:
  COIN_NAME: raptoreum
  BUILD_DIR: raptoreum-build
  COMPRESS_DIR: raptoreum-compress
  TEST_DIR: raptoreum-test
  FALLBACK_DOWNLOAD_PATH: https://sign.raptoreum.com/depends/

jobs:
  get-version:
    name: Get Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.selected-version.outputs.version }}
    steps:
      - name: Triggered By
        run: echo "checking out $GITHUB_REF triggered by $GITHUB_EVENT_NAME"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Read versions
        id: versions
        uses: christian-draeger/read-properties@1.1.1
        with:
          path: build.properties
          properties: "release-version candidate-version snapshot-version"

      - name: Choose version
        id: selected-version
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]] || [[ "$GITHUB_REF" == *develop ]] || [[ "$GITHUB_REF" == *ft/* ]] || [[ "$GITHUB_REF" == *bug/* ]]; then
              version=${{ steps.versions.outputs.snapshot-version }}
          elif [[ "$GITHUB_EVENT_NAME" != "pull_request" ]] && [[ "$GITHUB_REF" == *"release/"* ]]; then
              version=${{ steps.versions.outputs.candidate-version }}
          elif [[ "$GITHUB_EVENT_NAME" != "pull_request" ]] && [[ "$GITHUB_REF" == "refs/heads/master" ]]; then
              version=${{ steps.versions.outputs.release-version }}
          fi
          echo "version is: [$version]"
          echo "version=$version" >> $GITHUB_OUTPUT
          echo "BUILD_VERSION=$version" > version.txt

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: version
          path: version.txt

  # ============================================================================
  # Linux Builds (Ubuntu 22, Ubuntu 24, ARM64)
  # ============================================================================
  
  build-linux:
    name: ${{ matrix.platform.name }} Build
    needs: get-version
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Ubuntu 22
            runner: ubuntu-22.04
            host: x86_64-pc-linux-gnu
            packages: curl libcurl4-openssl-dev build-essential libtool autotools-dev automake pkg-config python3 bsdmainutils cmake ccache
            platform-id: ubuntu22
            strip-command: strip

          - name: Ubuntu 24
            runner: ubuntu-24.04
            host: x86_64-pc-linux-gnu
            packages: curl libcurl4-openssl-dev build-essential libtool autotools-dev automake pkg-config python3 bsdmainutils cmake ccache
            platform-id: ubuntu24
            strip-command: strip

          - name: ARM 64-bit
            runner: ubuntu-22.04
            host: aarch64-linux-gnu
            packages: curl libcurl4-openssl-dev build-essential libtool g++-aarch64-linux-gnu autotools-dev automake pkg-config python3 bsdmainutils cmake ccache
            platform-id: arm64
            strip-command: aarch64-linux-gnu-strip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Required Packages
        run: |
          sudo apt-get update -y
          sudo apt-get install ${{ matrix.platform.packages }} -y

      - name: Setup Dependencies
        uses: ./.github/actions/setup-depends
        with:
          host: ${{ matrix.platform.host }}
          fallback-download-path: ${{ env.FALLBACK_DOWNLOAD_PATH }}

      - name: Build Release Binaries
        uses: ./.github/actions/build-binaries
        with:
          host: ${{ matrix.platform.host }}
          build-type: release

      - name: Collect Release Binaries
        run: |
          mkdir -p ${BUILD_DIR} ${TEST_DIR}
          
          # For native builds, create stripped and non-stripped versions
          if [[ "${{ matrix.platform.host }}" != "aarch64-linux-gnu" ]]; then
            mkdir -p ${BUILD_DIR}_not_strip
            cp src/{raptoreum-cli,raptoreumd,qt/raptoreum-qt} ${BUILD_DIR}/
            mv src/{raptoreum-cli,raptoreumd,qt/raptoreum-qt} ${BUILD_DIR}_not_strip/
            ${{ matrix.platform.strip-command }} ${BUILD_DIR}/*
          else
            # For ARM cross-compile, just move binaries (don't strip)
            mv src/{raptoreum-cli,raptoreumd,qt/raptoreum-qt} ${BUILD_DIR}/
          fi
          
          mv src/test/test_raptoreum ${TEST_DIR}

      - name: Clean for Debug Build
        run: |
          make clean
          make distclean

      - name: Build Debug Binaries
        uses: ./.github/actions/build-binaries
        with:
          host: ${{ matrix.platform.host }}
          build-type: debug

      - name: Collect Debug Binaries
        run: |
          mkdir -p ${BUILD_DIR}_debug
          mv src/{raptoreum-cli,raptoreumd,qt/raptoreum-qt} ${BUILD_DIR}_debug/

      - name: Package Artifacts
        uses: ./.github/actions/package-artifacts
        with:
          platform: ${{ matrix.platform.platform-id }}
          version: ${{ needs.get-version.outputs.version }}
          coin-name: ${{ env.COIN_NAME }}

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.COIN_NAME }}-${{ matrix.platform.platform-id }}-${{ needs.get-version.outputs.version }}
          path: ${{ env.COMPRESS_DIR }}

      - name: Upload Test Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.COIN_NAME }}-${{ matrix.platform.platform-id }}-test-${{ needs.get-version.outputs.version }}
          path: ${{ env.TEST_DIR }}

  test-linux:
    name: ${{ matrix.platform.name }} Tests
    needs: [get-version, build-linux]
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Ubuntu 22
            runner: ubuntu-22.04
            platform-id: ubuntu22
            
          - name: Ubuntu 24
            runner: ubuntu-24.04
            platform-id: ubuntu24

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Test Artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.COIN_NAME }}-${{ matrix.platform.platform-id }}-test-${{ needs.get-version.outputs.version }}

      - name: Run Tests
        uses: ./.github/actions/run-tests
        with:
          platform: ${{ matrix.platform.name }}
          version: ${{ needs.get-version.outputs.version }}
          coin-name: ${{ env.COIN_NAME }}

  # ============================================================================
  # EVM consensus regression gate (Capa B + reorg fuzz)
  #
  # Drives the canonical ethereum/tests Cancun corpus through our own
  # pipeline and runs the deep-reorg property fuzz. The Capa B suite
  # holds a committed allow-list of the classified residual fixtures and
  # a pass-count floor (see docs/evm/OFFICIAL-TESTS.md "CI gating"): any
  # NEW failure — a fresh consensus divergence — exits non-zero and
  # fails this job. evmone is pinned to v0.12.0 by the unit-test version
  # pin that already runs in the normal test job; this job adds the
  # higher-value state-equivalence gate. Single platform: EVM state is
  # platform-independent, so one deterministic run is sufficient.
  #
  # Additive job — it cannot affect the existing build/test jobs. The
  # fixtures are a sparse, blob-filtered, cached checkout of
  # ethereum/tests @ v14.0 (the tag matched to evmone 0.12.0).
  # ============================================================================
  evm-consensus-gate:
    name: EVM Consensus Gate
    needs: [get-version, build-linux]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Test Artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.COIN_NAME }}-ubuntu24-test-${{ needs.get-version.outputs.version }}

      - name: Cache ethereum/tests fixtures
        id: fixtures-cache
        uses: actions/cache@v4
        with:
          path: ethereum-tests
          key: ethereum-tests-v14.0-blockchain-genstate

      - name: Fetch ethereum/tests @ v14.0 (sparse)
        if: steps.fixtures-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v14.0 --filter=blob:none --sparse \
            https://github.com/ethereum/tests.git ethereum-tests
          cd ethereum-tests
          git sparse-checkout set BlockchainTests/GeneralStateTests

      - name: Capa B + reorg fuzz + D4 mirror (consensus regression gate)
        shell: bash
        run: |
          set -euo pipefail
          chmod +x test_raptoreum
          # Capa B (Cancun fixtures) + reorg fuzz, plus the consensus-critical
          # EVM-native suites: the D4 Smart-Asset bidirectional mirror
          # (wrap/unwrap structural delta binding, apply-level credit/debit,
          # the T-mirror convergence invariants, the ERC-20 ledger surface),
          # the value bridges (FUND/SPEND), the D2 commitment + CCbTx v3, and
          # the structural EVM-tx validation. These are hard gates: a
          # regression in any one blocks the build, not just the Windows
          # full-suite run.
          EVM_OFFICIAL_TESTS_PATH="$PWD/ethereum-tests/BlockchainTests/GeneralStateTests" \
            ./test_raptoreum \
              --run_test=evm_official_blockchaintest_tests,evm_reorg_fuzz_tests,evm_wrap_consensus_tests,evm_asset_wrap_tests,evm_asset_mirror_convergence_tests,evm_asset_erc20_tests,evm_asset_resolver_tests,evm_evmtx_validation_tests,evm_fund_tests,evm_spend_credit_tests,evm_d2_consensus_tests,cbtx_evm_commit_tests \
              --log_level=message 2>&1 | tee evm_consensus_gate.log
          # test_raptoreum's exit code already reflects the baseline
          # gate (non-zero on any unexpected failure); `set -o pipefail`
          # propagates it through the tee.

      - name: Upload gate log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ env.COIN_NAME }}-evm-consensus-gate-${{ needs.get-version.outputs.version }}
          path: evm_consensus_gate.log

  # ============================================================================
  # Windows Build
  # ============================================================================
  
  build-windows:
    name: Windows 64-bit Build
    needs: get-version
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Required Packages
        run: |
          sudo apt-get update -y
          sudo apt-get install curl libcurl4-openssl-dev build-essential libtool autotools-dev automake pkg-config python3 bsdmainutils cmake ccache -y
          sudo apt-get install -y g++-mingw-w64-x86-64 gcc-mingw-w64-x86-64 nsis
          sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix

      - name: Setup Dependencies
        uses: ./.github/actions/setup-depends
        with:
          host: x86_64-w64-mingw32
          fallback-download-path: ${{ env.FALLBACK_DOWNLOAD_PATH }}

      - name: Build Release Binaries
        uses: ./.github/actions/build-binaries
        with:
          host: x86_64-w64-mingw32
          build-type: release

      - name: Collect Release Binaries
        run: |
          mkdir -p ${BUILD_DIR} ${BUILD_DIR}_not_strip ${TEST_DIR}
          cp src/{raptoreum-cli.exe,raptoreumd.exe,qt/raptoreum-qt.exe} ${BUILD_DIR}/
          mv src/{raptoreum-cli.exe,raptoreumd.exe,qt/raptoreum-qt.exe} ${BUILD_DIR}_not_strip/
          mv src/test/test_raptoreum.exe ${TEST_DIR}
          strip ${BUILD_DIR}/*

      - name: Package Windows Artifacts
        run: |
          cd ${BUILD_DIR}
          echo "sha256:" >> checksums.txt
          echo "------------------------------------" >> checksums.txt
          shasum * >> checksums.txt
          echo "------------------------------------" >> checksums.txt
          echo "openssl-sha256:" >> checksums.txt
          echo "------------------------------------" >> checksums.txt
          sha256sum * >> checksums.txt
          cat checksums.txt
          zip -r ../${COIN_NAME}-win-${{ needs.get-version.outputs.version }}.zip .
          
          cd ../${BUILD_DIR}_not_strip
          echo "sha256:" >> checksums.txt
          echo "------------------------------------" >> checksums.txt
          shasum * >> checksums.txt
          echo "------------------------------------" >> checksums.txt
          echo "openssl-sha256:" >> checksums.txt
          echo "------------------------------------" >> checksums.txt
          sha256sum * >> checksums.txt
          cat checksums.txt
          zip -r ../${COIN_NAME}-win-not_strip-${{ needs.get-version.outputs.version }}.zip .
          
          cd ..
          mkdir -p ${COMPRESS_DIR}
          mv *.zip ${COMPRESS_DIR}/
          
          cd ${COMPRESS_DIR}
          echo "sha256: $(shasum ${COIN_NAME}-win-${{ needs.get-version.outputs.version }}.zip)" >> checksums.txt
          echo "openssl-sha256: $(sha256sum ${COIN_NAME}-win-${{ needs.get-version.outputs.version }}.zip)" >> checksums.txt
          echo "sha256: $(shasum ${COIN_NAME}-win-not_strip-${{ needs.get-version.outputs.version }}.zip)" >> checksums.txt
          echo "openssl-sha256: $(sha256sum ${COIN_NAME}-win-not_strip-${{ needs.get-version.outputs.version }}.zip)" >> checksums.txt
          cat checksums.txt

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.COIN_NAME }}-win64-${{ needs.get-version.outputs.version }}
          path: ${{ env.COMPRESS_DIR }}

      - name: Upload Test Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.COIN_NAME }}-win64-test-${{ needs.get-version.outputs.version }}
          path: ${{ env.TEST_DIR }}

  test-windows:
    name: Windows 64-bit Tests
    needs: [get-version, build-windows]
    runs-on: windows-latest

    steps:

      - name: Download Test Artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.COIN_NAME }}-win64-test-${{ needs.get-version.outputs.version }}

      - name: Run Unit Tests
        id: tests
        shell: cmd
        run: test_raptoreum.exe --log_format=JUNIT > unit_test_results.xml

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ env.COIN_NAME }}-win64-test-results-${{ needs.get-version.outputs.version }}
          path: unit_test_results.xml

      - name: Publish Unit Test Report
        uses: mikepenz/action-junit-report@v5
        if: always()
        with:
          check_name: "Windows 64"
          detailed_summary: ${{ steps.tests.conclusion == 'failure' }}
          include_passed: false
          report_paths: unit_test_results.xml

